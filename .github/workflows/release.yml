# Тег vX.Y.Z → сборка установщика и публикация GitHub Release.
# Программа сама находит такие релизы и предлагает обновиться.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Релиз не выходит, если хоть один тест упал.
      - name: Test
        run: dotnet test tests/Futuretray.Tests -c Release

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/release.ps1 -Version $version

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))[^\n]*\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          Set-Content notes.md ($section ? $section : "Futuretray $version")
          gh release create '${{ github.ref_name }}' "dist/FuturetraySetup-$version.exe" dist/Futuretray.zip --title "Futuretray $version" --notes-file notes.md
