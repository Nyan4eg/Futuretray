# Сборка и тесты на каждый пуш и pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test tests/Futuretray.Tests -c Release --logger "console;verbosity=normal"
